strategy:
  name: dynamic_max_carry
  eligible_families: [IC, IM]
  min_dte: 5
  max_dte: 120
  max_notional_to_nav: 1.0
  roll_before_expiry_days: 3
  carry_column: signal_carry
  selection_score_column: selection_score
  switch_cost_bps: 2.0
  roll_score_buffer: 0.0005
  min_volume: 0
  min_open_interest: 0

front_switch:
  enabled: true
  eligible_families: [IC, IM]
  roll_before_expiry_days: 0
  roll_score_buffer: 0.002

risk_control:
  enabled: true
  # Default production-facing candidate: reduce equity beta without
  # suppressing the strategy during every downtrend/high-volatility spell.
  target_beta: 0.9
  regime_enabled: false
  beta_lookback: 60
  beta_min_periods: 20
  momentum_lookback: 63
  volatility_lookback: 20
  volatility_quantile_lookback: 252
  volatility_quantile: 0.8
  downtrend_weight: 0.75
  high_volatility_weight: 0.75
  max_weight: 1.0

carry:
  day_count: 365
  use_fair_value_adjustment: false
  funding_rate_annual: 0.02
  dividend_yield_annual: 0.015

net_carry:
  enabled: true
  funding_rate_annual: 0.02
  dividend_yield_annual: 0.015
  switch_cost_bps: 2.0
  output_column: net_carry_score

portfolio:
  initial_nav: 10000000
  collateral_yield_annual: 0.015
  commission_bps: 0.5
  slippage_bps: 0.5
  margin_rate: 0.12
  margin_buffer: 1.2
  integer_contracts: true
  signal_lag_sessions: 1
  execution_price_col: settle
  mark_price_col: settle
  max_participation_rate: 0.10
  spread_bps_column: spread_bps
  default_spread_bps: 0.0

allocation:
  enabled: true
  method: percentile
  lookback: 60
  min_periods: 20
  entry_threshold: 0.5
  zscore_scale: 1.0
  max_weight: 1.0
  vol_target_enabled: true
  target_vol_annual: 0.10
  vol_lookback: 60
  vol_min_periods: 20
  vol_price_column: spot_close

report:
  output_dir: outputs

contracts:
  IF:
    multiplier: 300
  IH:
    multiplier: 300
  IC:
    multiplier: 200
  IM:
    multiplier: 200
